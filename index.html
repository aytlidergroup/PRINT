<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090D16" />
  <title>AYT Halal • Remote Label Print</title>
  <style>
    :root {
      --bg-primary: #090D16;
      --bg-elevated: rgba(20, 27, 41, 0.78);
      --glass-border: rgba(255, 255, 255, 0.13);
      --glass-highlight: rgba(255, 255, 255, 0.07);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --accent: #10B981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --accent-blue: #38BDF8;
      --input-bg: rgba(11, 17, 30, 0.82);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 8%, rgba(16, 185, 129, 0.18), transparent 44%),
        radial-gradient(circle at 88% 18%, rgba(56, 189, 248, 0.16), transparent 46%),
        radial-gradient(circle at 50% 96%, rgba(99, 102, 241, 0.14), transparent 52%),
        #090D16;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 14px) + 12px) clamp(12px, 4vw, 18px) calc(env(safe-area-inset-bottom, 18px) + 28px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-pill-wrap {
      display: flex;
      justify-content: center;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      max-width: 100%;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    .brand-card {
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 16px;
      backdrop-filter: blur(24px) saturate(175%);
      -webkit-backdrop-filter: blur(24px) saturate(175%);
      box-shadow:
        inset 0 1px 0 var(--glass-highlight),
        0 18px 36px rgba(0, 0, 0, 0.38);
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo-container {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .logo-fallback {
      display: none;
      font-weight: 800;
      font-size: 14px;
      color: #0F172A;
      text-align: center;
      line-height: 1.1;
    }

    .brand-info {
      min-width: 0;
      flex: 1;
    }

    .brand-info h1 {
      margin: 0;
      font-size: clamp(16px, 4.5vw, 18px);
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-info p {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    .spec-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 600;
    }

    .glass-card {
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 18px 16px;
      backdrop-filter: blur(24px) saturate(175%);
      -webkit-backdrop-filter: blur(24px) saturate(175%);
      box-shadow:
        inset 0 1px 0 var(--glass-highlight),
        0 20px 42px rgba(0, 0, 0, 0.42);
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 0;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 0 2px;
    }

    label {
      font-size: 12.5px;
      font-weight: 600;
      color: #CBD5E1;
      white-space: nowrap;
    }

    .hint-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(16, 185, 129, 0.13);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    input[type="text"],
    input[type="date"],
    input[type="number"] {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      color-scheme: dark;
    }

    input[type="date"] {
      padding: 0 8px;
      font-size: 14px;
    }

    input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      background: rgba(15, 23, 42, 0.96);
    }

    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      min-width: 0;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 10px;
      min-width: 0;
    }

    .stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: var(--input-bg);
    }

    .stepper button {
      width: 34px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-primary);
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .stepper button:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.18);
    }

    .stepper input {
      flex: 1;
      width: 100%;
      min-width: 28px;
      height: 38px;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      padding: 0 2px;
      box-shadow: none !important;
      -moz-appearance: textfield;
    }

    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .preview-strip {
      background: rgba(11, 17, 30, 0.72);
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-lg);
      padding: 11px 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
    }

    .preview-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .preview-item strong {
      color: var(--text-primary);
      font-weight: 700;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .print-btn {
      margin-top: 2px;
      width: 100%;
      height: 54px;
      border: none;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      font-size: 16.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow:
        0 12px 26px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .print-btn:active {
      transform: scale(0.97);
    }

    .print-btn:disabled {
      background: #334155;
      color: #94A3B8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .toast {
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      display: none;
      word-break: break-word;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toast.ok {
      display: block;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #6EE7B7;
    }

    .toast.err {
      display: block;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #FCA5A5;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #64748B;
      padding-top: 2px;
      line-height: 1.4;
    }

    @media (max-width: 370px) {
      .date-grid,
      .bottom-grid {
        grid-template-columns: 1fr;
      }

      .brand-card {
        padding: 14px;
        gap: 12px;
      }

      .logo-container {
        width: 52px;
        height: 52px;
        border-radius: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <main class="app-shell">
    <div class="status-pill-wrap">
      <div class="status-pill">
        <span class="pulse-dot"></span>
        <span>AYT Cloud Print • Ready</span>
      </div>
    </div>

    <section class="brand-card">
      <div class="logo-container">
        <img
          id="brandLogo"
          src="LOGO2.png"
          alt="AYT Halal Logo"
          onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';"
        />
        <div id="logoFallback" class="logo-fallback">AYT<br/>HALAL</div>
      </div>
      <div class="brand-info">
        <h1>AYT HALAL MEAT</h1>
        <p>Remote Thermal Label Dispatch</p>
        <span class="spec-badge">80 × 130 mm • ZPL Direct</span>
      </div>
    </section>

    <section class="glass-card">
      <div class="field-group">
        <div class="field-header">
          <label for="name">Product Name</label>
          <span class="hint-tag">Required</span>
        </div>
        <input type="text" id="name" placeholder="Enter product name..." autocomplete="off" required />
      </div>

      <div class="date-grid">
        <div class="field-group">
          <div class="field-header">
            <label for="mfgDate">Production</label>
          </div>
          <input type="date" id="mfgDate" required />
        </div>

        <div class="field-group">
          <div class="field-header">
            <label for="expDate">Expiry (+1 Yr)</label>
          </div>
          <input type="date" id="expDate" required />
        </div>
      </div>

      <div class="bottom-grid">
        <div class="field-group">
          <div class="field-header">
            <label for="lotNumber">LOT (Week - 1)</label>
            <span class="hint-tag" id="weekBadge">Auto</span>
          </div>
          <input type="text" id="lotNumber" required />
        </div>

        <div class="field-group">
          <div class="field-header">
            <label for="copies">Copies</label>
          </div>
          <div class="stepper">
            <button type="button" onclick="adjustCopies(-1)" aria-label="Decrease copies">−</button>
            <input type="number" id="copies" value="1" min="1" max="500" />
            <button type="button" onclick="adjustCopies(1)" aria-label="Increase copies">+</button>
          </div>
        </div>
      </div>

      <div class="preview-strip">
        <div class="preview-item"><span>Prod</span><strong id="prevMfg">--.--.----</strong></div>
        <div class="preview-item"><span>Exp</span><strong id="prevExp">--.--.----</strong></div>
        <div class="preview-item"><span>LOT</span><strong id="prevLot">--</strong></div>
      </div>

      <button id="printBtn" class="print-btn" onclick="sendPrintToGitHub()">
        <span>🖨️</span>
        <span>Send to Printer</span>
      </button>

      <div id="statusBox" class="toast"></div>
    </section>

    <div class="footer-note">
      AYT HALAL MEAT PROVIDER SRL • Popesti-Leordeni, Romania
    </div>
  </main>

  <script>
    const GITHUB_OWNER = "aytlidergroup";
    const GITHUB_REPO = "PRINT";
    const FILE_PATH = "print_queue.json";

    // Token stored as ASCII character codes
    const TOKEN_ASCII = [
      103, 105, 116, 104, 117, 98, 95, 112, 97, 116, 95, 49, 49, 67, 86, 88,
      66, 52, 89, 65, 48, 75, 100, 98, 53, 69, 53, 84, 69, 76, 55, 104,
      109, 95, 51, 77, 81, 86, 70, 77, 87, 88, 98, 76, 107, 84, 55, 79,
      49, 49, 102, 73, 101, 53, 67, 79, 111, 79, 85, 83, 88, 49, 119, 108,
      109, 116, 69, 76, 77, 88, 48, 76, 68, 115, 49, 84, 85, 71, 54, 55,
      70, 68, 53, 76, 72, 67, 66, 115, 50, 67, 97, 111, 52
    ];

    function getGitHubToken() {
      return String.fromCharCode(...TOKEN_ASCII);
    }

    function toIsoLocal(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatDateDDMMYYYY(isoDate) {
      if (!isoDate || !isoDate.includes("-")) return "--.--.----";
      const [y, m, d] = isoDate.split("-");
      return `${d}.${m}.${y}`;
    }

    function getISOWeekNumber(dateObj) {
      const temp = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
      const dayNum = temp.getUTCDay() || 7;
      temp.setUTCDate(temp.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(temp.getUTCFullYear(), 0, 1));
      return Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
    }

    function updatePreview() {
      const mfgVal = document.getElementById("mfgDate").value;
      const expVal = document.getElementById("expDate").value;
      const lotVal = document.getElementById("lotNumber").value.trim();

      document.getElementById("prevMfg").textContent = formatDateDDMMYYYY(mfgVal);
      document.getElementById("prevExp").textContent = formatDateDDMMYYYY(expVal);
      document.getElementById("prevLot").textContent = lotVal || "--";
    }

    function syncDefaultsFromDate(baseDate) {
      const mfgInput = document.getElementById("mfgDate");
      const expInput = document.getElementById("expDate");
      const lotInput = document.getElementById("lotNumber");
      const weekBadge = document.getElementById("weekBadge");

      mfgInput.value = toIsoLocal(baseDate);

      const expDate = new Date(baseDate);
      expDate.setFullYear(expDate.getFullYear() + 1);
      expInput.value = toIsoLocal(expDate);

      const currentWeek = getISOWeekNumber(baseDate);
      const lotWeek = currentWeek > 1 ? currentWeek - 1 : 52;
      lotInput.value = String(lotWeek);
      weekBadge.textContent = `W${currentWeek} − 1`;

      updatePreview();
    }

    function adjustCopies(delta) {
      const input = document.getElementById("copies");
      const current = parseInt(input.value, 10) || 1;
      input.value = Math.max(1, Math.min(500, current + delta));
    }

    window.addEventListener("DOMContentLoaded", () => {
      syncDefaultsFromDate(new Date());

      document.getElementById("mfgDate").addEventListener("change", (e) => {
        if (e.target.value) {
          const [y, m, d] = e.target.value.split("-").map(Number);
          const picked = new Date(y, m - 1, d);
          const expDate = new Date(picked);
          expDate.setFullYear(expDate.getFullYear() + 1);
          document.getElementById("expDate").value = toIsoLocal(expDate);

          const wk = getISOWeekNumber(picked);
          const lotWk = wk > 1 ? wk - 1 : 52;
          document.getElementById("lotNumber").value = String(lotWk);
          document.getElementById("weekBadge").textContent = `W${wk} − 1`;
        }
        updatePreview();
      });

      document.getElementById("expDate").addEventListener("change", updatePreview);
      document.getElementById("lotNumber").addEventListener("input", updatePreview);
    });

    function toBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin);
    }

    function fromBase64Utf8(b64) {
      const bin = atob(b64.replace(/\n/g, ""));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    async function sendPrintToGitHub() {
      const btn = document.getElementById("printBtn");
      const statusBox = document.getElementById("statusBox");

      const name = document.getElementById("name").value.trim();
      const mfgRaw = document.getElementById("mfgDate").value;
      const expRaw = document.getElementById("expDate").value;
      const lot = document.getElementById("lotNumber").value.trim();
      const copies = parseInt(document.getElementById("copies").value, 10);

      if (!name || !mfgRaw || !expRaw || !lot || !copies || copies < 1) {
        statusBox.className = "toast err";
        statusBox.textContent = "Please fill in Product Name and all required fields.";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "<span>⏳</span><span>Sending...</span>";
      statusBox.style.display = "none";

      const token = getGitHubToken();
      const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
      const headers = {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      };

      const newOrder = {
        id: Date.now(),
        name: name,
        mfg_date: formatDateDDMMYYYY(mfgRaw),
        exp_date: formatDateDDMMYYYY(expRaw),
        lot_number: lot,
        copies: copies,
        status: "PENDING"
      };

      try {
        let saved = false;
        for (let attempt = 0; attempt < 4; attempt++) {
          let items = [];
          let sha = null;

          const getRes = await fetch(apiUrl, { headers, cache: "no-store" });
          if (getRes.ok) {
            const fileData = await getRes.json();
            sha = fileData.sha;
            const decoded = fromBase64Utf8(fileData.content).trim();
            items = decoded ? JSON.parse(decoded) : [];
          } else if (getRes.status !== 404) {
            throw new Error(`GitHub read failed (HTTP ${getRes.status})`);
          }

          items.push(newOrder);

          const payload = {
            message: `Add print job: ${name} (LOT ${lot})`,
            content: toBase64Utf8(JSON.stringify(items, null, 2)),
            ...(sha ? { sha } : {})
          };

          const putRes = await fetch(apiUrl, {
            method: "PUT",
            headers,
            body: JSON.stringify(payload)
          });

          if (putRes.ok) {
            saved = true;
            break;
          }

          if (putRes.status === 409 && attempt < 3) {
            await new Promise((r) => setTimeout(r, 350));
            continue;
          }

          const errJson = await putRes.json().catch(() => ({}));
          throw new Error(errJson.message || `GitHub write failed (HTTP ${putRes.status})`);
        }

        if (!saved) throw new Error("Could not save after retries.");

        if (navigator.vibrate) navigator.vibrate(40);
        statusBox.className = "toast ok";
        statusBox.textContent = `✅ Sent "${name}" (×${copies}) to printer queue!`;
      } catch (err) {
        statusBox.className = "toast err";
        statusBox.textContent = "❌ " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>🖨️</span><span>Send to Printer</span>";
      }
    }
  </script>
</body>
</html>
